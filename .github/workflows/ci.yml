name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Ubuntu only. The codebase has no platform-specific behaviour (Intl,
    # crypto.subtle, node:path, node:os are stable across OSes) and we
    # explicitly don't target Windows. macOS runners cost 10× toward the
    # Actions budget and add nothing — developers exercise the code on
    # their own macs locally, and the E2E workflow (release-gate and
    # nightly) also runs on Ubuntu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test:unit
      - run: pnpm -r test:integration
